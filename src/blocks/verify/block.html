<section class="ab-verify" aria-labelledby="ab-verify-title">
  <div class="card ab-verify__card">
    <span class="ab-verify__icon" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="5" width="18" height="14" rx="2.5" />
        <path d="m4 7 8 6 8-6" />
      </svg>
    </span>

    <div class="ab-verify__header">
      <h1 id="ab-verify-title">Check your email</h1>
      <p>We sent a six-digit code to <strong>maya@northstar.studio</strong>. It expires in 10 minutes.</p>
    </div>

    <form class="stack ab-verify__form" novalidate>
      <label class="field ab-verify__field">
        <span class="field-label">Verification code</span>
        <span class="otp lg">
          <input class="input" name="code" type="text" autocomplete="one-time-code" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" required aria-describedby="ab-verify-help" />
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
        </span>
        <span class="field-help" id="ab-verify-help">Paste the whole code or type it digit by digit.</span>
      </label>

      <button class="btn primary ab-verify__submit" type="submit">Verify and continue</button>
    </form>

    <div class="ab-verify__help">
      <p>Didn't get it? Check spam, or <a href="#resend">send a new code</a>.</p>
      <p><a href="#change-email">Use a different email</a></p>
    </div>
  </div>

  <p class="ab-verify__secure">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="5" y="11" width="14" height="10" rx="2" />
      <path d="M8 11V8a4 4 0 0 1 8 0v3" />
    </svg>
    We will never ask for this code by phone or chat.
  </p>
</section>
